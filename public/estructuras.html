<!DOCTYPE html> <html lang="es"> <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCRIS - Equipos</title>
<style>
        /* VARIABLES MODO OSCURO DE ALTO CONTRASTE */
        :root {
            --bg-body: #f3f6f9; --bg-panel: #ffffff; --text-main: #1f2937; --text-muted: #64748b;
            --text-heading: #0b3d62; --border-color: #cbd5e1; --bg-header: #0b3d62; --th-bg: #0b3d62;
        }
        [data-tema="oscuro"] {
            --bg-body: #121212; --bg-panel: #1e1e1e; --text-main: #f8fafc; --text-muted: #94a3b8;
            --text-heading: #60a5fa; --border-color: #3f3f46; --bg-header: #0f172a; --th-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: var(--bg-body) !important; color: var(--text-main) !important; transition: 0.3s; }
        header { background: var(--bg-header) !important; color: white !important; padding: 22px; transition: 0.3s; }
        header h1, header p { color: #ffffff !important; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .panel { background: var(--bg-panel) !important; padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; }
        h2, strong { color: var(--text-heading) !important; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .campo { display: flex; flex-direction: column; }
        .completo { grid-column: 1 / -1; }
        label { font-weight: bold; margin-bottom: 7px; color: var(--text-main); }
        input, select, textarea { padding: 11px; background: var(--bg-panel) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; border-radius: 6px; font-size: 15px; }
        textarea { min-height: 90px; resize: vertical; }
        .ayuda, .mensaje { color: var(--text-muted) !important; font-size: 13px; margin-top: 5px; }
        
        .botones { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: var(--bg-header); color: white; border: none; padding: 11px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { filter: brightness(0.8); }
        .volver { background: #64748b; }
        .eliminar { background: #b91c1c; padding: 8px 12px; font-size: 13px;}
        .btn-editar { background: #f59e0b; padding: 8px 12px; font-size: 13px; color: white;}
        
        /* ALTO CONTRASTE BOTONES MODO OSCURO */
        [data-tema="oscuro"] button { background-color: #3b82f6 !important; color: white !important; border: 1px solid #60a5fa !important; }
        [data-tema="oscuro"] button:hover { background-color: #2563eb !important; }
        [data-tema="oscuro"] button.volver { background-color: #475569 !important; border: 1px solid #94a3b8 !important; }
        [data-tema="oscuro"] button.volver:hover { background-color: #64748b !important; }
        [data-tema="oscuro"] .eliminar { background-color: #dc2626 !important; border: 1px solid #f87171 !important; }
        [data-tema="oscuro"] .btn-editar { background-color: #f59e0b !important; border: 1px solid #fbbf24 !important; }

        .tabla-contenedor { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { background: var(--th-bg) !important; color: white !important; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color) !important; color: var(--text-main) !important; }
        tr:hover { background: rgba(128,128,128,0.05); }

        .estado-operativo { color: #15803d !important; font-weight: bold; }
        .estado-mantenimiento { color: #ca8a04 !important; font-weight: bold; }
        .estado-fuera { color: #b91c1c !important; font-weight: bold; }
        [data-tema="oscuro"] .estado-operativo { color: #4ade80 !important; }
        [data-tema="oscuro"] .estado-mantenimiento { color: #facc15 !important; }
        [data-tema="oscuro"] .estado-fuera { color: #f87171 !important; }
        
        .acciones-celda { display: flex; gap: 5px; flex-wrap: nowrap; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 20px;}
        .modal-contenido { width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; background: var(--bg-panel); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }

        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .completo { grid-column: auto; } .container { margin-top: 15px; padding: 0 10px; } .panel { padding: 18px; } }
</style>
</head> 
<body> 
<header><h1>OCRIS</h1><p>Registro y gestión de equipos de Redes de Media Tensión</p></header> 
<main class="container"> 
<section class="panel">
<h2>🏗️ Registrar equipo</h2>
<form id="formEquipo">
    <div class="grid">
        <div class="campo"><label>Placa en Poste *</label><input type="text" name="codigo" placeholder="Ej: REC-001" required><span class="ayuda">El código debe ser único.</span></div>
        <div class="campo"><label>Tipo de equipo *</label>
            <select name="tipo" required>
                <option value="">Seleccione...</option><option value="OCRIS">OCRIS</option><option value="Reconectadores">Reconectadores</option><option value="Reguladores">Reguladores</option><option value="Varios">Varios</option>
            </select>
        </div>
        <div class="campo"><label>Marca</label><input type="text" name="marca" list="lista-marcas" placeholder="Seleccione o escriba...">
            <datalist id="lista-marcas"><option value="ABB"><option value="EATON"><option value="MERLIN GERIN"><option value="IBERAPA"><option value="TOSHIBA"><option value="ITB"><option value="COOPER"><option value="ROMAGNOLE"><option value="SCHNEIDER"></datalist>
        </div>
        <div class="campo"><label>Modelo</label><input type="text" name="modelo" placeholder="Modelo del equipo"></div>
        <div class="campo"><label>Número de serie</label><input type="text" name="numero_serie" placeholder="Número de serie"></div>
        <div class="campo"><label>Fecha de instalación</label><input type="date" name="fecha_instalacion"></div>
        <div class="campo"><label>Ubicación</label><input type="text" name="ubicacion" placeholder="Sector / dirección"></div>
        <div class="campo"><label>Estado</label>
            <select name="estado">
                <option value="Operativo">Operativo</option><option value="En mantenimiento">En mantenimiento</option><option value="Fuera de servicio">Fuera de servicio</option>
            </select>
        </div>
        <div class="campo"><label>Latitud</label><input type="text" name="latitud" placeholder="Ej: -17.7833"></div>
        <div class="campo"><label>Longitud</label><input type="text" name="longitud" placeholder="Ej: -63.1821"></div>
        <div class="campo completo"><label>Observaciones</label><textarea name="observaciones" placeholder="Información técnica, características, recomendaciones, etc."></textarea></div>
    </div>
    <div class="botones">
        <button type="submit">💾 Guardar equipo</button>
        <button type="button" class="volver" onclick="window.location.href='index.html'">← Volver al inicio</button>
    </div>
</form>
</section> 

<section class="panel">
<h2>📋 Equipos registrados</h2>
<div class="tabla-contenedor">
    <table>
        <thead><tr><th>ID</th><th>Código</th><th>Tipo</th><th>Marca</th><th>Modelo</th><th>N° Serie</th><th>Instalación</th><th>Ubicación</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tablaEquipos"><tr><td colspan="10" class="mensaje">Cargando equipos...</td></tr></tbody>
    </table>
</div>
</section> 
</main> 

<!-- MODAL EDITAR -->
<div id="modalEditar" class="modal">
    <div class="modal-contenido">
        <h2>✏️ Editar Equipo</h2>
        <form id="formEditarEquipo">
            <input type="hidden" id="editId">
            <div class="grid">
                <div class="campo"><label>Placa en Poste *</label><input type="text" id="editCodigo" required></div>
                <div class="campo"><label>Tipo de equipo *</label>
                    <select id="editTipo" required>
                        <option value="OCRIS">OCRIS</option><option value="Reconectadores">Reconectadores</option><option value="Reguladores">Reguladores</option><option value="Varios">Varios</option>
                    </select>
                </div>
                <div class="campo"><label>Marca</label><input type="text" id="editMarca" list="lista-marcas-edit">
                    <datalist id="lista-marcas-edit"><option value="ABB"><option value="EATON"><option value="MERLIN GERIN"><option value="IBERAPA"><option value="TOSHIBA"><option value="ITB"><option value="COOPER"><option value="ROMAGNOLE"><option value="SCHNEIDER"></datalist>
                </div>
                <div class="campo"><label>Modelo</label><input type="text" id="editModelo"></div>
                <div class="campo"><label>Número de serie</label><input type="text" id="editNumeroSerie"></div>
                <div class="campo"><label>Fecha de instalación</label><input type="date" id="editFechaInstalacion"></div>
                <div class="campo"><label>Ubicación</label><input type="text" id="editUbicacion"></div>
                <div class="campo"><label>Estado</label>
                    <select id="editEstado">
                        <option value="Operativo">Operativo</option><option value="En mantenimiento">En mantenimiento</option><option value="Fuera de servicio">Fuera de servicio</option>
                    </select>
                </div>
                <div class="campo"><label>Latitud</label><input type="text" id="editLatitud"></div>
                <div class="campo"><label>Longitud</label><input type="text" id="editLongitud"></div>
                <div class="campo completo"><label>Observaciones</label><textarea id="editObservaciones"></textarea></div>
            </div>
            <div class="botones">
                <button type="submit">💾 Guardar Cambios</button>
                <button type="button" class="volver" onclick="document.getElementById('modalEditar').style.display='none'">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');
    const formulario = document.getElementById("formEquipo");
    const tabla = document.getElementById("tablaEquipos");
    let listaEquipos = [];

    function escapar(valor) {
        if (valor === null || valor === undefined) return "";
        return String(valor).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    async function cargarEquipos() {
        try {
            const respuesta = await fetch("/api/estructuras");
            if (!respuesta.ok) throw new Error("Error");
            listaEquipos = await respuesta.json();
            tabla.innerHTML = "";
            if (listaEquipos.length === 0) { tabla.innerHTML = `<tr><td colspan="10" class="mensaje">No hay equipos registrados.</td></tr>`; return; }

            listaEquipos.forEach(equipo => {
                const fila = document.createElement("tr");
                let claseEstado = "";
                if (equipo.estado === "Operativo") claseEstado = "estado-operativo";
                if (equipo.estado === "En mantenimiento") claseEstado = "estado-mantenimiento";
                if (equipo.estado === "Fuera de servicio") claseEstado = "estado-fuera";

                fila.innerHTML = `
                    <td>${equipo.id || ""}</td>
                    <td><strong>${escapar(equipo.codigo)}</strong></td>
                    <td>${escapar(equipo.tipo)}</td>
                    <td>${escapar(equipo.marca)}</td>
                    <td>${escapar(equipo.modelo)}</td>
                    <td>${escapar(equipo.numero_serie)}</td>
                    <td>${escapar(equipo.fecha_instalacion)}</td>
                    <td>${escapar(equipo.ubicacion)}</td>
                    <td class="${claseEstado}">${escapar(equipo.estado)}</td>
                    <td>
                        <div class="acciones-celda">
                            <button class="btn-editar" onclick="abrirEditar(${equipo.id})">✏️ Editar</button>
                            <button class="eliminar" onclick="eliminarEquipo(${equipo.id})">🗑️</button>
                        </div>
                    </td>
                `;
                tabla.appendChild(fila);
            });
        } catch (error) { tabla.innerHTML = `<tr><td colspan="10" class="mensaje">❌ No se pudieron cargar.</td></tr>`; }
    }

    formulario.addEventListener("submit", async function(evento) {
        evento.preventDefault();
        const datos = new FormData(formulario);
        const equipo = { codigo: datos.get("codigo"), tipo: datos.get("tipo"), marca: datos.get("marca"), modelo: datos.get("modelo"), numero_serie: datos.get("numero_serie"), fecha_instalacion: datos.get("fecha_instalacion"), ubicacion: datos.get("ubicacion"), estado: datos.get("estado"), latitud: datos.get("latitud"), longitud: datos.get("longitud"), observaciones: datos.get("observaciones") };
        try {
            const respuesta = await fetch("/api/estructuras", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(equipo) });
            const resultado = await respuesta.json();
            if (resultado.ok) { alert("✅ Guardado"); formulario.reset(); cargarEquipos(); }
            else alert("❌ " + resultado.mensaje);
        } catch (error) { alert("❌ Error de conexión"); }
    });

    function abrirEditar(idBusqueda) {
        const eq = listaEquipos.find(item => item.id === idBusqueda);
        if (!eq) return;

        document.getElementById('editId').value = eq.id;
        document.getElementById('editCodigo').value = eq.codigo;
        document.getElementById('editTipo').value = eq.tipo;
        document.getElementById('editMarca').value = eq.marca || "";
        document.getElementById('editModelo').value = eq.modelo || "";
        document.getElementById('editNumeroSerie').value = eq.numero_serie || "";
        document.getElementById('editFechaInstalacion').value = eq.fecha_instalacion || "";
        document.getElementById('editUbicacion').value = eq.ubicacion || "";
        document.getElementById('editEstado').value = eq.estado || "Operativo";
        document.getElementById('editLatitud').value = eq.latitud || "";
        document.getElementById('editLongitud').value = eq.longitud || "";
        document.getElementById('editObservaciones').value = eq.observaciones || "";
        
        document.getElementById('modalEditar').style.display = 'flex';
    }

    document.getElementById("formEditarEquipo").addEventListener("submit", async function(evento) {
        evento.preventDefault();
        const id = document.getElementById('editId').value;
        const equipoActualizado = { 
            codigo: document.getElementById('editCodigo').value, 
            tipo: document.getElementById('editTipo').value, 
            marca: document.getElementById('editMarca').value, 
            modelo: document.getElementById('editModelo').value, 
            numero_serie: document.getElementById('editNumeroSerie').value, 
            fecha_instalacion: document.getElementById('editFechaInstalacion').value, 
            ubicacion: document.getElementById('editUbicacion').value, 
            estado: document.getElementById('editEstado').value, 
            latitud: document.getElementById('editLatitud').value, 
            longitud: document.getElementById('editLongitud').value, 
            observaciones: document.getElementById('editObservaciones').value 
        };
        
        const btn = evento.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = "⏳ Guardando...";

        try {
            const respuesta = await fetch(`/api/estructuras/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(equipoActualizado) });
            const resultado = await respuesta.json();
            if (resultado.ok) { 
                alert("✅ Actualizado correctamente"); 
                document.getElementById('modalEditar').style.display = 'none';
                cargarEquipos(); 
            }
            else alert("❌ " + resultado.mensaje);
        } catch (error) { alert("❌ Error de conexión"); }
        finally { btn.disabled = false; btn.textContent = "💾 Guardar Cambios"; }
    });

    async function eliminarEquipo(id) {
        if (!confirm("¿Seguro que deseas eliminar?")) return;
        try {
            const respuesta = await fetch("/api/estructuras/" + id, { method: "DELETE" });
            const resultado = await respuesta.json();
            if (resultado.ok) { alert("✅ Eliminado"); cargarEquipos(); }
            else {
                if (respuesta.status === 403) alert("❌ Acceso denegado. Solo administradores pueden eliminar.");
                else alert("❌ " + resultado.mensaje);
            }
        } catch (error) { alert("❌ Error de conexión"); }
    }

    cargarEquipos();
</script>
</body> 
</html>
