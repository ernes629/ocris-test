<!DOCTYPE html> <html lang="es"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>OCRIS - Equipos</title>

<style>
    /* VARIABLES MODO OSCURO DE ALTO CONTRASTE */
        :root {
            --bg-body: #f3f6f9; --bg-panel: #ffffff; --text-main: #1f2937;
            --border-color: #cbd5e1; --bg-header: #0b3d62; --th-bg: #0b3d62;
        }
        [data-tema="oscuro"] {
            --bg-body: #121212; --bg-panel: #1e1e1e; --text-main: #e0e0e0;
            --border-color: #333333; --bg-header: #051b43; --th-bg: #111;
        }
        body { background: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        header { background: var(--bg-header) !important; transition: 0.3s; }
        .panel, .formulario, .login, .grafico-tarjeta, .tarjeta { background: var(--bg-panel) !important; border: 1px solid var(--border-color); }
        input, select, textarea, .buscar, .filtro { background: var(--bg-panel) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; }
        th { background: var(--th-bg) !important; }
        td { border-bottom: 1px solid var(--border-color); }
        
        /* ALTO CONTRASTE BOTONES MODO OSCURO */
        [data-tema="oscuro"] button { background-color: #3b82f6 !important; color: white !important; border: 1px solid #60a5fa !important; }
        [data-tema="oscuro"] button:hover { background-color: #2563eb !important; }
        [data-tema="oscuro"] button.volver, [data-tema="oscuro"] button.limpiar, [data-tema="oscuro"] button.inicio { background-color: #475569 !important; border: 1px solid #94a3b8 !important; }
        [data-tema="oscuro"] button.volver:hover { background-color: #64748b !important; }
        [data-tema="oscuro"] .btn-eliminar, [data-tema="oscuro"] .eliminar, [data-tema="oscuro"] .pdf { background-color: #dc2626 !important; border: 1px solid #f87171 !important; }
:root { --bg-body: #f3f6f9; --bg-panel: #ffffff; --text-main: #1f2937; --border-color: #cbd5e1; --bg-header: #0b3d62; }
[data-tema="oscuro"] { --bg-body: #121212; --bg-panel: #1e1e1e; --text-main: #e0e0e0; --border-color: #333333; --bg-header: #051b43; }
body { background: var(--bg-body); color: var(--text-main); }
.panel, .formulario { background: var(--bg-panel) !important; color: var(--text-main); border: 1px solid var(--border-color); }
input, select, textarea { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); }
header { background: var(--bg-header) !important; }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f3f6f9;
        color: #1f2937;
    }

    header {
        background: #0b3d62;
        color: white;
        padding: 22px;
    }

    header h1 {
        font-size: 28px;
    }

    header p {
        margin-top: 5px;
        color: #dbeafe;
    }

    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .panel {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow:
            0 2px 8px rgba(0,0,0,0.08);

        margin-bottom: 25px;
    }

    h2 {
        color: #0b3d62;
        margin-bottom: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .campo {
        display: flex;
        flex-direction: column;
    }

    .completo {
        grid-column: 1 / -1;
    }

    label {
        font-weight: bold;
        margin-bottom: 7px;
    }

    input,
    select,
    textarea {

        padding: 11px;

        border:
            1px solid #cbd5e1;

        border-radius: 6px;

        font-size: 15px;

        background: white;
    }

    textarea {

        min-height: 90px;

        resize: vertical;
    }

    .ayuda {

        color: #64748b;

        font-size: 13px;

        margin-top: 5px;
    }

    .botones {

        margin-top: 20px;

        display: flex;

        gap: 10px;

        flex-wrap: wrap;
    }

    button {

        background: #0b3d62;

        color: white;

        border: none;

        padding: 11px 18px;

        border-radius: 6px;

        cursor: pointer;

        font-weight: bold;
    }

    button:hover {

        background: #075985;
    }

    .volver {

        background: #64748b;
    }

    .volver:hover {

        background: #475569;
    }

    .eliminar {

        background: #b91c1c;
    }

    .eliminar:hover {

        background: #991b1b;
    }

    .tabla-contenedor {

        overflow-x: auto;
    }

    table {

        width: 100%;

        border-collapse: collapse;

        min-width: 1100px;
    }

    th {

        background: #0b3d62;

        color: white;

        padding: 12px;

        text-align: left;

        white-space: nowrap;
    }

    td {

        padding: 12px;

        border-bottom:
            1px solid #e5e7eb;
    }

    tr:hover {

        background: #f8fafc;
    }

    .mensaje {

        text-align: center;

        padding: 20px;

        color: #64748b;
    }

    .estado-operativo {

        color: #15803d;

        font-weight: bold;
    }

    .estado-mantenimiento {

        color: #ca8a04;

        font-weight: bold;
    }

    .estado-fuera {

        color: #b91c1c;

        font-weight: bold;
    }

    @media (max-width: 700px) {

        .grid {

            grid-template-columns: 1fr;
        }

        .completo {

            grid-column: auto;
        }

        .container {

            margin-top: 15px;

            padding: 0 10px;
        }

        .panel {

            padding: 18px;
        }

        header h1 {

            font-size: 24px;
        }

    }

</style>

</head> <body> <!-- ================================================= --> <!-- ENCABEZADO --> <!-- ================================================= --> <header>
<h1>OCRIS</h1>

<p>
    Registro y gestión de equipos
    de Redes de Media Tensión
</p>

</header> <main class="container"> <!-- ================================================= --> <!-- REGISTRAR EQUIPO --> <!-- ================================================= --> <section class="panel">
<h2>
    🏗️ Registrar equipo
</h2>

<form id="formEquipo">

    <div class="grid">

        <!-- CÓDIGO -->

        <div class="campo">

            <label>
                Código del equipo *
            </label>

            <input
                type="text"
                name="codigo"
                placeholder="Ej: REC-001"
                required>

            <span class="ayuda">
                El código debe ser único.
            </span>

        </div>

        <!-- TIPO -->

        <div class="campo">

            <label>
                Tipo de equipo *
            </label>

            <select
                name="tipo"
                required>

                <option value="">
                    Seleccione...
                </option>

                <option value="OCRIS">
                    OCRIS
                </option>

                <option value="Reconectadores">
                    Reconectadores
                </option>

                <option value="Reguladores">
                    Reguladores
                </option>

                <option value="Varios">
                    Varios
                </option>

            </select>

        </div>

                <!-- MARCA -->

        <div class="campo">

            <label>
                Marca
            </label>

            <input
                type="text"
                name="marca"
                list="lista-marcas"
                placeholder="Seleccione o escriba...">
                
            <datalist id="lista-marcas">
                <option value="ABB">
                <option value="EATON">
                <option value="MERLIN GERIN">
                <option value="IBERAPA">
                <option value="TOSHIBA">
                <option value="ITB">
                <option value="COOPER">
                <option value="ROMAGNOLE">
                <option value="SCHNEIDER">
            </datalist>

        </div>

        <!-- MODELO -->

        <div class="campo">

            <label>
                Modelo
            </label>

            <input
                type="text"
                name="modelo"
                placeholder="Modelo del equipo">

        </div>

        <!-- NÚMERO DE SERIE -->

        <div class="campo">

            <label>
                Número de serie
            </label>

            <input
                type="text"
                name="numero_serie"
                placeholder="Número de serie">

        </div>

        <!-- FECHA INSTALACIÓN -->

        <div class="campo">

            <label>
                Fecha de instalación
            </label>

            <input
                type="date"
                name="fecha_instalacion">

        </div>

        <!-- UBICACIÓN -->

        <div class="campo">

            <label>
                Ubicación
            </label>

            <input
                type="text"
                name="ubicacion"
                placeholder="Sector / dirección">

        </div>

        <!-- ESTADO -->

        <div class="campo">

            <label>
                Estado
            </label>

            <select
                name="estado">

                <option value="Operativo">
                    Operativo
                </option>

                <option value="En mantenimiento">
                    En mantenimiento
                </option>

                <option value="Fuera de servicio">
                    Fuera de servicio
                </option>

            </select>

        </div>

        <!-- LATITUD -->

        <div class="campo">

            <label>
                Latitud
            </label>

            <input
                type="text"
                name="latitud"
                placeholder="Ej: -17.7833">

        </div>

        <!-- LONGITUD -->

        <div class="campo">

            <label>
                Longitud
            </label>

            <input
                type="text"
                name="longitud"
                placeholder="Ej: -63.1821">

        </div>

        <!-- OBSERVACIONES -->

        <div class="campo completo">

            <label>
                Observaciones
            </label>

            <textarea
                name="observaciones"
                placeholder="Información técnica, características, recomendaciones, etc."></textarea>

        </div>

    </div>

    <!-- BOTONES -->

    <div class="botones">

        <button type="submit">

            💾 Guardar equipo

        </button>

        <button
            type="button"
            class="volver"
            onclick="window.location.href='index.html'">

            ← Volver al inicio

        </button>

    </div>

</form>

</section> <!-- ================================================= --> <!-- LISTADO --> <!-- ================================================= --> <section class="panel">
<h2>
    📋 Equipos registrados
</h2>

<div class="tabla-contenedor">

    <table>

        <thead>

            <tr>

                <th>
                    ID
                </th>

                <th>
                    Código
                </th>

                <th>
                    Tipo
                </th>

                <th>
                    Marca
                </th>

                <th>
                    Modelo
                </th>

                <th>
                    N° Serie
                </th>

                <th>
                    Instalación
                </th>

                <th>
                    Ubicación
                </th>

                <th>
                    Estado
                </th>

                <th>
                    Acción
                </th>

            </tr>

        </thead>

        <tbody id="tablaEquipos">

            <tr>

                <td
                    colspan="10"
                    class="mensaje">

                    Cargando equipos...

                </td>

            </tr>

        </tbody>

    </table>

</div>

</section> </main> <script>
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');
// =====================================================
// REFERENCIAS
// =====================================================

const formulario =
document.getElementById("formEquipo");

const tabla =
document.getElementById("tablaEquipos");

// =====================================================
// CARGAR EQUIPOS
// =====================================================

async function cargarEquipos() {

try {

    const respuesta =
        await fetch(
            "/api/estructuras"
        );

    if (!respuesta.ok) {

        throw new Error(
            "Error al cargar equipos"
        );

    }

    const equipos =
        await respuesta.json();

    tabla.innerHTML = "";

    if (equipos.length === 0) {

        tabla.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="mensaje">

                    No hay equipos registrados.

                </td>

            </tr>

        `;

        return;

    }

    equipos.forEach(
        equipo => {

            const fila =
                document.createElement("tr");

            let claseEstado = "";

            if (
                equipo.estado ===
                "Operativo"
            ) {

                claseEstado =
                    "estado-operativo";

            }

            if (
                equipo.estado ===
                "En mantenimiento"
            ) {

                claseEstado =
                    "estado-mantenimiento";

            }

            if (
                equipo.estado ===
                "Fuera de servicio"
            ) {

                claseEstado =
                    "estado-fuera";

            }

            fila.innerHTML = `

                <td>
                    ${equipo.id || ""}
                </td>

                <td>
                    <strong>
                        ${equipo.codigo || ""}
                    </strong>
                </td>

                <td>
                    ${equipo.tipo || ""}
                </td>

                <td>
                    ${equipo.marca || ""}
                </td>

                <td>
                    ${equipo.modelo || ""}
                </td>

                <td>
                    ${equipo.numero_serie || ""}
                </td>

                <td>
                    ${equipo.fecha_instalacion || ""}
                </td>

                <td>
                    ${equipo.ubicacion || ""}
                </td>

                <td class="${claseEstado}">
                    ${equipo.estado || ""}
                </td>

                <td>

                    <button
                        class="eliminar"
                        onclick="
                            eliminarEquipo(
                                ${equipo.id}
                            )
                        ">

                        Eliminar

                    </button>

                </td>

            `;

            tabla.appendChild(fila);

        }
    );

} catch (error) {

    console.error(error);

    tabla.innerHTML = `

        <tr>

            <td
                colspan="10"
                class="mensaje">

                ❌ No se pudieron cargar
                los equipos.

            </td>

        </tr>

    `;

}

}

// =====================================================
// GUARDAR EQUIPO
// =====================================================

formulario.addEventListener(
"submit",
async function(evento) {

    evento.preventDefault();

    const datos =
        new FormData(formulario);

    const equipo = {

        codigo:
            datos.get("codigo"),

        tipo:
            datos.get("tipo"),

        marca:
            datos.get("marca"),

        modelo:
            datos.get("modelo"),

        numero_serie:
            datos.get("numero_serie"),

        fecha_instalacion:
            datos.get(
                "fecha_instalacion"
            ),

        ubicacion:
            datos.get("ubicacion"),

        estado:
            datos.get("estado"),

        latitud:
            datos.get("latitud"),

        longitud:
            datos.get("longitud"),

        observaciones:
            datos.get("observaciones")

    };

    try {

        const respuesta =
            await fetch(
                "/api/estructuras",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            equipo
                        )

                }
            );

        const resultado =
            await respuesta.json();

        if (resultado.ok) {

            alert(
                "✅ Equipo guardado correctamente"
            );

            formulario.reset();

            cargarEquipos();

        } else {

            alert(

                "❌ " +
                (
                    resultado.mensaje ||
                    "No se pudo guardar el equipo"
                )

            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "❌ Error de conexión con OCRIS"
        );

    }

}

);

// =====================================================
// ELIMINAR EQUIPO
// =====================================================

async function eliminarEquipo(id) {

if (
    !confirm(
        "¿Seguro que deseas eliminar este equipo?"
    )
) {

    return;

}

try {

    const respuesta =
        await fetch(
            "/api/estructuras/" + id,
            {
                method: "DELETE"
            }
        );

    const resultado =
        await respuesta.json();

    if (resultado.ok) {

        alert(
            "✅ Equipo eliminado correctamente"
        );

        cargarEquipos();

    } else {

        alert(

            "❌ " +
            (
                resultado.mensaje ||
                "No se pudo eliminar el equipo"
            )

        );

    }

} catch (error) {

    console.error(error);

    alert(
        "❌ Error de conexión con OCRIS"
    );

}

}

// =====================================================
// INICIAR
// =====================================================

cargarEquipos();

</script> </body> </html>
