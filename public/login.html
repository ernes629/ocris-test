<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRIS - Iniciar sesión</title>
    <style>
        /* VARIABLES MODO OSCURO DE ALTO CONTRASTE */
        :root {
            --bg-body: #f3f6f9; --bg-panel: #ffffff; --text-main: #1f2937; --text-muted: #64748b;
            --text-heading: #0b3d62; --border-color: #cbd5e1; --bg-header: #0b3d62;
        }
        [data-tema="oscuro"] {
            --bg-body: #121212; --bg-panel: #1e1e1e; --text-main: #f8fafc; --text-muted: #94a3b8;
            --text-heading: #60a5fa; --border-color: #3f3f46; --bg-header: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: var(--bg-body) !important; color: var(--text-main) !important; transition: 0.3s; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .login { width: 100%; max-width: 420px; background: var(--bg-panel) !important; padding: 35px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); border: 1px solid var(--border-color); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: var(--text-heading) !important; font-size: 38px; margin-bottom: 8px; }
        .logo p { color: var(--text-muted) !important; margin: 0; }
        .campo { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 7px; color: var(--text-main); }
        input { width: 100%; padding: 13px; border: 1px solid var(--border-color) !important; border-radius: 7px; font-size: 16px; background: var(--bg-body) !important; color: var(--text-main) !important; }
        input:focus { outline: none; border-color: #3b82f6 !important; }
        
        button { width: 100%; padding: 13px; border: none; border-radius: 7px; background: var(--bg-header); color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { filter: brightness(0.8); }
        
        /* ALTO CONTRASTE BOTONES MODO OSCURO */
        [data-tema="oscuro"] button { background-color: #3b82f6 !important; color: white !important; border: 1px solid #60a5fa !important; }
        [data-tema="oscuro"] button:hover { background-color: #2563eb !important; }

        .mensaje { margin-top: 18px; padding: 12px; border-radius: 6px; text-align: center; display: none; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        [data-tema="oscuro"] .error { background: rgba(220,38,38,0.2); color: #f87171; }
        .info { margin-top: 25px; text-align: center; color: var(--text-muted) !important; font-size: 13px; }
    </style>
</head>
<body>
<div class="login">
    <div class="logo">
        <h1>⚡ OCRIS</h1>
        <p>Sistema de Gestión de Mantenimiento MT</p>
    </div>
    <form id="formLogin">
        <div class="campo"><label>Usuario</label><input type="text" id="usuario" autocomplete="username" required></div>
        <div class="campo"><label>Contraseña</label><input type="password" id="password" autocomplete="current-password" required></div>
        <button type="submit">🔐 Iniciar sesión</button>
    </form>
    <div id="mensaje" class="mensaje error"></div>
    <div class="info">OCRIS © 2026</div>
</div>
<script>
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');
    document.getElementById("formLogin").addEventListener("submit", async function(e) {
        e.preventDefault();
        const usuario = document.getElementById("usuario").value.trim();
        const password = document.getElementById("password").value;
        const mensaje = document.getElementById("mensaje");
        mensaje.style.display = "none";
        try {
            const respuesta = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario, password }) });
            const resultado = await respuesta.json();
            if (resultado.ok) window.location.href = "/";
            else { mensaje.textContent = "❌ " + (resultado.mensaje || "Usuario o contraseña incorrectos"); mensaje.style.display = "block"; }
        } catch (error) {
            mensaje.textContent = "❌ No se pudo conectar con OCRIS."; mensaje.style.display = "block";
        }
    });
</script>
</body>
</html>
