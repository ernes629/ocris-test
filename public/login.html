<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OCRIS - Iniciar sesión</title>


    <style>
        /* VARIABLES MODO OSCURO DE ALTO CONTRASTE */
        :root {
            --bg-body: #f3f6f9; --bg-panel: #ffffff; --text-main: #1f2937;
            --border-color: #cbd5e1; --bg-header: #0b3d62; --th-bg: #0b3d62;
        }
        [data-tema="oscuro"] {
            --bg-body: #121212; --bg-panel: #1e1e1e; --text-main: #e0e0e0;
            --border-color: #333333; --bg-header: #051b43; --th-bg: #111;
        }
        body { background: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        header { background: var(--bg-header) !important; transition: 0.3s; }
        .panel, .formulario, .login, .grafico-tarjeta, .tarjeta { background: var(--bg-panel) !important; border: 1px solid var(--border-color); }
        input, select, textarea, .buscar, .filtro { background: var(--bg-panel) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; }
        th { background: var(--th-bg) !important; }
        td { border-bottom: 1px solid var(--border-color); }
        
        /* ALTO CONTRASTE BOTONES MODO OSCURO */
        [data-tema="oscuro"] button { background-color: #3b82f6 !important; color: white !important; border: 1px solid #60a5fa !important; }
        [data-tema="oscuro"] button:hover { background-color: #2563eb !important; }
        [data-tema="oscuro"] button.volver, [data-tema="oscuro"] button.limpiar, [data-tema="oscuro"] button.inicio { background-color: #475569 !important; border: 1px solid #94a3b8 !important; }
        [data-tema="oscuro"] button.volver:hover { background-color: #64748b !important; }
        [data-tema="oscuro"] .btn-eliminar, [data-tema="oscuro"] .eliminar, [data-tema="oscuro"] .pdf { background-color: #dc2626 !important; border: 1px solid #f87171 !important; }

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .login {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 14px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);
        }


        .logo {
            text-align: center;
            margin-bottom: 30px;
        }


        .logo h1 {
            color: #0b3d62;
            font-size: 38px;
            margin-bottom: 8px;
        }


        .logo p {
            color: #64748b;
            margin: 0;
        }


        .campo {
            margin-bottom: 18px;
        }


        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #1f2937;
        }


        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }


        input:focus {
            outline: none;
            border-color: #0b3d62;
        }


        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;

            background: #0b3d62;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #075985;
        }


        .mensaje {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }


        .error {
            background: #fee2e2;
            color: #991b1b;
        }


        .info {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="login">


    <div class="logo">

        <h1>⚡ OCRIS</h1>

        <p>
            Sistema de Gestión de Mantenimiento MT
        </p>

    </div>


    <form id="formLogin">


        <div class="campo">

            <label>
                Usuario
            </label>

            <input
                type="text"
                id="usuario"
                autocomplete="username"
                required>

        </div>


        <div class="campo">

            <label>
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required>

        </div>


        <button type="submit">

            🔐 Iniciar sesión

        </button>


    </form>


    <div
        id="mensaje"
        class="mensaje error">
    </div>


    <div class="info">

        OCRIS © 2026

    </div>


</div>



<script>
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');
if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');

    document
        .getElementById("formLogin")
        .addEventListener(
            "submit",
            async function(evento) {


                evento.preventDefault();


                const usuario =
                    document
                        .getElementById("usuario")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const mensaje =
                    document
                        .getElementById("mensaje");


                mensaje.style.display =
                    "none";


                try {


                    const respuesta =
                        await fetch(
                            "/api/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        usuario,
                                        password
                                    })

                            }
                        );


                    const resultado =
                        await respuesta.json();


                    if (resultado.ok) {

                        window.location.href =
                            "/";

                    } else {

                        mensaje.textContent =
                            "❌ " +
                            (
                                resultado.mensaje ||
                                "Usuario o contraseña incorrectos"
                            );

                        mensaje.style.display =
                            "block";

                    }


                } catch (error) {

                    console.error(error);

                    mensaje.textContent =
                        "❌ No se pudo conectar con OCRIS.";

                    mensaje.style.display =
                        "block";

                }

            }
        );


</script>


</body>

</html>
