<!DOCTYPE html> 
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRIS - Usuarios</title>
    <style>
        /* VARIABLES MODO OSCURO DE ALTO CONTRASTE */
        :root {
            --bg-body: #f3f6f9; --bg-panel: #ffffff; --text-main: #1f2937; --text-muted: #64748b;
            --text-heading: #0b3d62; --border-color: #cbd5e1; --bg-header: #0b3d62; --th-bg: #0b3d62;
        }
        [data-tema="oscuro"] {
            --bg-body: #121212; --bg-panel: #1e1e1e; --text-main: #f8fafc; --text-muted: #94a3b8;
            --text-heading: #60a5fa; --border-color: #3f3f46; --bg-header: #0f172a; --th-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: var(--bg-body) !important; color: var(--text-main) !important; transition: 0.3s; }
        header { background: var(--bg-header) !important; color: white !important; padding: 22px; transition: 0.3s; }
        header h1, header p { color: #ffffff !important; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .panel { background: var(--bg-panel) !important; padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; }
        h2, strong { color: var(--text-heading) !important; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .campo { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 7px; color: var(--text-main); }
        input, select { padding: 11px; background: var(--bg-panel) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; border-radius: 6px; font-size: 15px; }
        
        .botones { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: var(--bg-header); color: white; border: none; padding: 11px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { filter: brightness(0.8); }
        .volver { background: #64748b; }
        .eliminar { background: #b91c1c; padding: 8px 12px; font-size: 13px; }
        
        /* ALTO CONTRASTE BOTONES MODO OSCURO */
        [data-tema="oscuro"] button { background-color: #3b82f6 !important; color: white !important; border: 1px solid #60a5fa !important; }
        [data-tema="oscuro"] button:hover { background-color: #2563eb !important; }
        [data-tema="oscuro"] button.volver { background-color: #475569 !important; border: 1px solid #94a3b8 !important; }
        [data-tema="oscuro"] button.volver:hover { background-color: #64748b !important; }
        [data-tema="oscuro"] .eliminar { background-color: #dc2626 !important; border: 1px solid #f87171 !important; }

        .tabla-contenedor { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: var(--th-bg) !important; color: white !important; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color) !important; color: var(--text-main) !important; }
        tr:hover { background: rgba(128,128,128,0.05); }
        .mensaje { text-align: center; padding: 20px; color: var(--text-muted) !important; }
        .rol-admin { color: #dc2626 !important; font-weight: bold; }
        .rol-tecnico { color: #16a34a !important; font-weight: bold; }
        [data-tema="oscuro"] .rol-admin { color: #f87171 !important; }
        [data-tema="oscuro"] .rol-tecnico { color: #4ade80 !important; }

        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head> 
<body> 
    <header><h1>OCRIS</h1><p>Gestión de personal y usuarios del sistema</p></header> 
    <main class="container"> 
        <section class="panel">
            <h2>👤 Registrar nuevo usuario</h2>
            <form id="formUsuario">
                <div class="grid">
                    <div class="campo"><label>Nombre completo *</label><input type="text" name="nombre" placeholder="Ej: Juan Pérez" required></div>
                    <div class="campo"><label>Nombre de usuario (Login) *</label><input type="text" name="usuario" placeholder="Ej: jperez" required></div>
                    <div class="campo"><label>Contraseña *</label><input type="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
                    <div class="campo"><label>Rol de acceso *</label>
                        <select name="rol" required>
                            <option value="Tecnico">Técnico (Solo registra)</option>
                            <option value="Administrador">Administrador (Acceso total)</option>
                        </select>
                    </div>
                </div>
                <div class="botones">
                    <button type="submit">💾 Guardar usuario</button>
                    <button type="button" class="volver" onclick="window.location.href='index.html'">← Volver al inicio</button>
                </div>
            </form>
        </section> 

        <section class="panel">
            <h2>📋 Usuarios registrados</h2>
            <div class="tabla-contenedor">
                <table>
                    <thead><tr><th>ID</th><th>Nombre Completo</th><th>Usuario (Login)</th><th>Rol</th><th>Acción</th></tr></thead>
                    <tbody id="tablaUsuarios"><tr><td colspan="5" class="mensaje">Cargando usuarios...</td></tr></tbody>
                </table>
            </div>
        </section> 
    </main> 

<script>
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');
    const tabla = document.getElementById("tablaUsuarios");
    const formulario = document.getElementById("formUsuario");

    async function cargarUsuarios() {
        try {
            const respuesta = await fetch("/api/usuarios");
            if (respuesta.status === 403) { alert("Acceso denegado. Solo administradores."); window.location.href = "index.html"; return; }
            if (!respuesta.ok) throw new Error("Error al cargar");

            const usuarios = await respuesta.json();
            tabla.innerHTML = "";
            if (usuarios.length === 0) { tabla.innerHTML = `<tr><td colspan="5" class="mensaje">No hay usuarios registrados.</td></tr>`; return; }

            usuarios.forEach(user => {
                const fila = document.createElement("tr");
                const claseRol = user.rol === "Administrador" ? "rol-admin" : "rol-tecnico";
                fila.innerHTML = `
                    <td>${user.id}</td><td><strong>${user.nombre}</strong></td><td>${user.usuario}</td>
                    <td class="${claseRol}">${user.rol}</td>
                    <td><button class="eliminar" onclick="eliminarUsuario(${user.id})">🗑️ Eliminar</button></td>
                `;
                tabla.appendChild(fila);
            });
        } catch (error) { tabla.innerHTML = `<tr><td colspan="5" class="mensaje">❌ Error cargando la lista.</td></tr>`; }
    }

    formulario.addEventListener("submit", async (e) => {
        e.preventDefault();
        const datos = { nombre: formulario.nombre.value, usuario: formulario.usuario.value, password: formulario.password.value, rol: formulario.rol.value };
        try {
            const respuesta = await fetch("/api/usuarios", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
            const resultado = await respuesta.json();
            if (resultado.ok) { alert("✅ " + resultado.mensaje); formulario.reset(); cargarUsuarios(); }
            else alert("❌ " + resultado.mensaje);
        } catch (error) { alert("❌ Error de conexión"); }
    });

    async function eliminarUsuario(id) {
        if (!confirm("¿Seguro que deseas eliminar este usuario de forma permanente?")) return;
        try {
            const respuesta = await fetch("/api/usuarios/" + id, { method: "DELETE" });
            const resultado = await respuesta.json();
            if (resultado.ok) { alert("✅ " + resultado.mensaje); cargarUsuarios(); }
            else alert("❌ " + resultado.mensaje);
        } catch (error) { alert("❌ Error de conexión al intentar eliminar."); }
    }
    cargarUsuarios();
</script> 
</body> 
</html>
