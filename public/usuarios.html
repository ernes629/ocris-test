<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OCRIS - Gestión de Usuarios</title>

    <style>
        /* =======================================================
           VARIABLES DE COLOR 
        ======================================================= */
        :root {
            --bg-body: #f1f5f9; --bg-panel: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border-color: #cbd5e1; --primary: #0284c7; --success: #16a34a; --danger: #dc2626;
            --warning: #f59e0b; --dark-btn: #475569;
        }
        [data-tema="oscuro"] {
            --bg-body: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --primary: #38bdf8; --success: #4ade80; --danger: #ef4444;
            --warning: #fbbf24; --dark-btn: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); transition: 0.2s; font-size: 16px; }
        
        header { background: var(--primary); color: white; padding: 25px 15px; text-align: center; }
        header h1 { font-size: 32px; margin-bottom: 8px; font-weight: 800; letter-spacing: 1px;}
        header p { font-size: 15px; opacity: 0.9; line-height: 1.4; max-width: 600px; margin: 0 auto;}
        [data-tema="oscuro"] header { color: #0f172a; }
        [data-tema="oscuro"] header h1, [data-tema="oscuro"] header p { color: #0f172a !important; font-weight: bold;}

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        
        .panel { background: var(--bg-panel); padding: 25px 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h2 { color: var(--text-main); margin-bottom: 20px; font-weight: 800; font-size: 22px;}
        
        /* FORMULARIO */
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px;}
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        .campo { display: flex; flex-direction: column; width: 100%; }
        label { font-weight: bold; margin-bottom: 8px; color: var(--text-main); font-size: 15px; }
        input, select { width: 100%; padding: 16px; background: var(--bg-body) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; border-radius: 8px; font-size: 16px; outline:none;}
        input:focus, select:focus { border-color: var(--primary) !important; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2); }
        
        .botones { display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 600px) { .botones { flex-direction: row; } }
        button { border: none; padding: 16px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; text-align: center; text-transform: uppercase; width: 100%; transition: 0.2s;}
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-accion { background: var(--success); color: white; }
        .btn-volver { background: transparent; color: var(--text-main); border: 2px solid var(--border-color); }
        
        /* BOTONES DE LA TABLA */
        .acciones-celda { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-editar { background: var(--warning); color: #0f172a !important; padding: 8px 12px; font-size: 13px; border-radius: 6px; width: auto; text-transform: none;}
        .btn-eliminar { background: var(--danger); color: white; padding: 8px 12px; font-size: 13px; border-radius: 6px; width: auto; text-transform: none;}

        /* TABLA */
        .tabla-contenedor { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px;}
        table { width: 100%; border-collapse: collapse; min-width: 600px; background: var(--bg-panel); }
        th { background: var(--bg-body) !important; color: var(--text-main) !important; padding: 16px 12px; text-align: left; font-size: 14px; text-transform: uppercase; border-bottom: 2px solid var(--border-color);}
        td { padding: 16px 12px; border-bottom: 1px solid var(--border-color) !important; color: var(--text-main) !important; vertical-align: middle; font-size: 15px;}
        tr:hover { background: rgba(128,128,128,0.05); }

        .rol-tag { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; background: rgba(2, 132, 199, 0.1); color: var(--primary); border: 1px solid var(--primary);}
        .rol-admin { background: rgba(220, 38, 38, 0.1); color: var(--danger); border-color: var(--danger);}
        .rol-super { background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: var(--warning);}

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: flex-start; padding: 20px; overflow-y: auto;}
        .modal-contenido { background: var(--bg-panel); width: 100%; max-width: 500px; padding: 25px; border-radius: 12px; margin-top: 50px; border: 1px solid var(--border-color);}
        .botones-modal { display: flex; gap: 10px; margin-top: 20px; flex-direction: column;}
        @media (min-width: 600px) { .botones-modal { flex-direction: row; } }
        .btn-guardar { background: var(--success); color: white; } .btn-cancelar { background: var(--dark-btn); color: white; }
    </style>
</head> 
<body> 
<header>
    <h1>OCRIS</h1>
    <p>Panel de Administración de Usuarios</p>
</header> 

<main class="container"> 
    <!-- FORMULARIO CREAR USUARIO -->
    <section class="panel">
        <h2>➕ Registrar Nuevo Usuario</h2>
        <form id="formUsuario">
            <div class="grid">
                <div class="campo">
                    <label>Nombre Completo *</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="campo">
                    <label>Usuario (Login) *</label>
                    <input type="text" id="usuario" placeholder="Ej: jperez" required autocomplete="off">
                </div>
                <div class="campo">
                    <label>Contraseña *</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                </div>
                <div class="campo">
                    <label>Rol en el sistema *</label>
                    <select id="rol" required>
                        <option value="Tecnico">Técnico (Reporta en Terreno)</option>
                        <option value="Supervisor">Supervisor (Genera Reportes)</option>
                        <option value="Administrador">Administrador (Control Total)</option>
                    </select>
                </div>
            </div>
            
            <div class="botones">
                <button type="submit" class="btn-accion" id="btnCrear">💾 Crear Cuenta</button>
                <button type="button" class="btn-volver" onclick="window.location.href='index.html'">🏠 Volver al Inicio</button>
            </div>
        </form>
    </section> 

    <!-- LISTADO DE USUARIOS -->
    <section class="panel">
        <h2>👥 Personal Autorizado</h2>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Registro</th><th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <tr><td colspan="6" style="text-align:center;">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </section> 
</main> 

<!-- MODAL EDITAR USUARIO -->
<div id="modalEditarUsuario" class="modal">
    <div class="modal-contenido">
        <h2 style="color:var(--warning);">✏️ Editar Usuario</h2>
        <form id="formEditarUsuario">
            <input type="hidden" id="editUserId">
            <div class="campo" style="margin-bottom: 15px;">
                <label>Usuario (Login)</label>
                <input type="text" id="editUserLogin" disabled style="background: rgba(128,128,128,0.1) !important; cursor:not-allowed;">
            </div>
            <div class="campo" style="margin-bottom: 15px;">
                <label>Rol en el sistema</label>
                <select id="editUserRol" required>
                    <option value="Tecnico">Técnico (Reporta en Terreno)</option>
                    <option value="Supervisor">Supervisor (Genera Reportes)</option>
                    <option value="Administrador">Administrador (Control Total)</option>
                </select>
            </div>
            <div class="campo" style="margin-bottom: 15px;">
                <label>Nueva Contraseña (Opcional)</label>
                <input type="password" id="editUserPassword" placeholder="Deje en blanco para no cambiar">
            </div>
            <div class="botones-modal">
                <button type="submit" class="btn-guardar" id="btnGuardarEditUser">💾 Guardar Cambios</button>
                <button type="button" class="btn-cancelar" onclick="document.getElementById('modalEditarUsuario').style.display='none'">❌ Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');
    
    // VERIFICAR PERMISOS (Solo Admin)
    async function comprobarAcceso() {
        try {
            const res = await fetch('/api/usuario');
            const data = await res.json();
            if (!data.usuario || data.usuario.rol !== 'Administrador') {
                alert("⛔ Acceso denegado: Área exclusiva para Administradores.");
                window.location.href = 'index.html';
            }
        } catch(e) { window.location.href = 'index.html'; }
    }

    async function cargarUsuarios() {
        const tabla = document.getElementById("tablaUsuarios");
        try {
            const res = await fetch("/api/usuarios");
            const usuarios = await res.json();
            tabla.innerHTML = "";
            
            usuarios.forEach(u => {
                let claseRol = "rol-tag";
                if(u.rol === "Administrador") claseRol += " rol-admin";
                if(u.rol === "Supervisor") claseRol += " rol-super";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><b>${u.id}</b></td>
                    <td>${escapar(u.nombre)}</td>
                    <td><b>${escapar(u.usuario)}</b></td>
                    <td><span class="${claseRol}">${u.rol}</span></td>
                    <td>${u.creado_en.split(' ')[0]}</td>
                    <td>
                        <div class="acciones-celda">
                            <button class="btn-editar" onclick="abrirEditarUsuario(${u.id}, '${escapar(u.usuario)}', '${u.rol}')">✏️ Editar</button>
                            <button class="btn-eliminar" onclick="eliminarUsuario(${u.id}, '${escapar(u.nombre)}')">🗑️ Eliminar</button>
                        </div>
                    </td>
                `;
                tabla.appendChild(tr);
            });
        } catch(e) { tabla.innerHTML = `<tr><td colspan="6" style="text-align:center;">Error al cargar.</td></tr>`; }
    }

    function escapar(v) { return (v==null) ? "" : String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }

    document.getElementById("formUsuario").addEventListener("submit", async function(e) {
        e.preventDefault();
        const btn = document.getElementById("btnCrear");
        btn.disabled = true; btn.textContent = "⏳ Creando...";

        const usuarioObj = {
            nombre: document.getElementById("nombre").value.trim(),
            usuario: document.getElementById("usuario").value.trim().toLowerCase(),
            password: document.getElementById("password").value,
            rol: document.getElementById("rol").value
        };

        try {
            const res = await fetch("/api/usuarios", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(usuarioObj)
            });
            const data = await res.json();
            
            if (data.ok) {
                alert("✅ Usuario creado exitosamente.");
                document.getElementById("formUsuario").reset();
                cargarUsuarios();
            } else { alert("❌ " + data.mensaje); }
        } catch (error) { alert("❌ Error de red."); }
        
        btn.disabled = false; btn.textContent = "💾 Crear Cuenta";
    });

    function abrirEditarUsuario(id, usuario, rol) {
        document.getElementById('editUserId').value = id;
        document.getElementById('editUserLogin').value = usuario;
        document.getElementById('editUserRol').value = rol;
        document.getElementById('editUserPassword').value = ''; 
        document.getElementById('modalEditarUsuario').style.display = 'flex';
    }

    document.getElementById("formEditarUsuario").addEventListener("submit", async function(e) {
        e.preventDefault();
        const id = document.getElementById('editUserId').value;
        const rol = document.getElementById('editUserRol').value;
        const password = document.getElementById('editUserPassword').value;

        const btn = document.getElementById("btnGuardarEditUser");
        btn.disabled = true; btn.textContent = "⏳ Guardando...";

        try {
            const res = await fetch(`/api/usuarios/${id}`, {
                method: "PUT", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ rol, password })
            });
            const data = await res.json();
            if(data.ok) {
                alert("✅ Usuario actualizado correctamente.");
                document.getElementById('modalEditarUsuario').style.display = 'none';
                cargarUsuarios();
            } else { alert("❌ " + data.mensaje); }
        } catch(e) { alert("❌ Error al guardar."); }
        btn.disabled = false; btn.textContent = "💾 Guardar Cambios";
    });

    async function eliminarUsuario(id, nombre) {
        if(!confirm(`⚠️ ¿Estás seguro de eliminar el acceso al usuario: ${nombre}?\nEsta acción es irreversible.`)) return;
        try {
            const res = await fetch(`/api/usuarios/${id}`, { method: "DELETE" });
            const data = await res.json();
            if (data.ok) { cargarUsuarios(); } else { alert("❌ " + data.mensaje); }
        } catch(e) { alert("❌ Error de red."); }
    }

    comprobarAcceso().then(cargarUsuarios);
</script>
</body> 
</html>
