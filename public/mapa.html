<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OCRIS - Mapa de Red MT</title>
    
    <!-- LIBRERÍAS DE MAPAS (LEAFLET) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-body: #f1f5f9; --bg-panel: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border-color: #cbd5e1; --primary: #0284c7; --success: #16a34a; --danger: #dc2626;
            --warning: #f59e0b; --dark-btn: #475569;
        }
        [data-tema="oscuro"] {
            --bg-body: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --primary: #38bdf8; --success: #4ade80; --danger: #ef4444;
            --warning: #fbbf24; --dark-btn: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); transition: 0.2s; font-size: 15px; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        
        header { background: var(--primary); color: white; padding: 20px 15px; text-align: center; flex-shrink: 0; }
        header h1 { font-size: 26px; margin-bottom: 5px; font-weight: 800; letter-spacing: 1px; }
        header p { font-size: 14px; opacity: 0.9; margin: 0 auto; font-weight: bold; }
        [data-tema="oscuro"] header { color: #0f172a; }

        main { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        .filtros { background: var(--bg-panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filtros select, .filtros button, .filtros input { padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main); font-size: 14px; outline: none; width: 100%; }
        
        .contenedor-buscador { position: relative; flex: 2; min-width: 250px; display: flex; }
        .filtro-item { flex: 1; min-width: 120px; }
        .filtros button { background: var(--dark-btn); color: white; border: none; font-weight: bold; cursor: pointer; flex: 0.5; min-width: 100px;}
        
        .autocomplete-items { position: absolute; border: 1px solid var(--border-color); border-top: none; z-index: 9999; top: 100%; left: 0; right: 0; max-height: 250px; overflow-y: auto; background-color: var(--bg-panel); box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 0 0 8px 8px; display: none; }
        .autocomplete-items div { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-size: 14px; display: flex; flex-direction: column; }
        .autocomplete-items div strong { color: var(--primary); }
        .autocomplete-items div small { color: var(--text-muted); font-size: 12px; margin-top: 2px;}
        .autocomplete-items div:hover { background-color: rgba(2, 132, 199, 0.1); }
        [data-tema="oscuro"] .autocomplete-items div:hover { background-color: rgba(56, 189, 248, 0.2); }

        #mapa-contenedor { flex-grow: 1; width: 100%; border-radius: 12px; border: 2px solid var(--border-color); overflow: hidden; min-height: 400px; background: #e2e8f0; position: relative;}
        
        .leaflet-popup-content-wrapper { background: var(--bg-panel); color: var(--text-main); border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .leaflet-popup-tip { background: var(--bg-panel); }
        .popup-custom h3 { color: var(--primary); margin-bottom: 5px; font-size: 16px; font-weight: 900;}
        .popup-custom p { margin: 3px 0; font-size: 13px;}
        .btn-navegar { display: block; width: 100%; background: var(--success); color: white !important; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        
        .pin-equipo { border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<header>
    <h1>🗺️ Mapa de Red OCRIS</h1>
    <p>Ubicación GPS y Navegación de Activos de Media Tensión</p>
</header>

<main>
    <div class="filtros">
        <div class="contenedor-buscador">
            <input type="text" id="buscarMapa" placeholder="🔍 Buscar por placa, ubicación o tipo..." autocomplete="off">
            <div id="listaSugerencias" class="autocomplete-items"></div>
        </div>
        
        <div class="filtro-item">
            <select id="filtroTipo" onchange="dibujarPines()">
                <option value="TODOS">Todos los Equipos</option>
                <option value="OCRIS">Solo OCRIS</option>
                <option value="RECONECTADOR">Solo Reconectadores</option>
                <option value="REGULADOR">Solo Reguladores</option>
            </select>
        </div>

        <div class="filtro-item">
            <select id="filtroTension" onchange="dibujarPines()">
                <option value="TODOS">Todas las Tensiones</option>
                <option value="10">10.5 KV</option>
                <option value="24">24.9 KV</option>
                <option value="34">34.5 KV</option>
            </select>
        </div>
        
        <div class="filtro-item">
            <select id="filtroEstado" onchange="dibujarPines()">
                <option value="TODOS">Todos los Estados</option>
                <option value="operativo">🟢 Operativos</option>
                <option value="en mantenimiento">🟡 En Mantenimiento</option>
                <option value="fuera de servicio">🔴 Fuera de servicio</option>
            </select>
        </div>
        
        <button onclick="window.location.href='index.html'">🏠 Volver</button>
    </div>

    <div id="mapa-contenedor"></div>
</main>

<script>
    if(localStorage.getItem('temaOscuro') === 'activo') document.documentElement.setAttribute('data-tema', 'oscuro');

    let mapa;
    let marcadores = [];
    let equiposGlobal = [];

    function inicializarMapa() {
        mapa = L.map('mapa-contenedor').setView([-17.7833, -63.1821], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap | OCRIS GOSSR',
            maxZoom: 19
        }).addTo(mapa);
    }

    async function cargarEquipos() {
        try {
            const res = await fetch('/api/estructuras', { headers: { 'Accept': 'application/json' } });
            if (res.status === 401) { window.location.href = '/login.html'; return; }
            if (res.ok) {
                equiposGlobal = await res.json();
                dibujarPines();
            }
        } catch (error) {
            console.error("Error al cargar equipos:", error);
            alert("No se pudieron cargar las ubicaciones.");
        }
    }

    const inputBuscar = document.getElementById("buscarMapa");
    const listaSugerencias = document.getElementById("listaSugerencias");

    inputBuscar.addEventListener("input", function() {
        const texto = this.value.toLowerCase().trim();
        listaSugerencias.innerHTML = "";

        if (texto === "") {
            listaSugerencias.style.display = "none";
            dibujarPines(); 
            return;
        }

        const coincidencias = equiposGlobal.filter(eq => {
            const txtPlaca = (eq.codigo || "").toLowerCase();
            const txtUbi = (eq.ubicacion || "").toLowerCase();
            const txtTipo = (eq.tipo || "").toLowerCase();
            return txtPlaca.includes(texto) || txtUbi.includes(texto) || txtTipo.includes(texto);
        }).slice(0, 8); 

        if (coincidencias.length > 0) {
            coincidencias.forEach(eq => {
                const div = document.createElement("div");
                div.innerHTML = `<strong>${eq.codigo}</strong> <small>${eq.ubicacion || 'Sin ubicación registrada'}</small>`;
                div.addEventListener("click", function() {
                    inputBuscar.value = eq.codigo;
                    listaSugerencias.style.display = "none";
                    dibujarPines(); 
                });
                listaSugerencias.appendChild(div);
            });
            listaSugerencias.style.display = "block";
        } else {
            listaSugerencias.style.display = "none";
        }

        dibujarPines();
    });

    document.addEventListener("click", function (e) {
        if (e.target !== inputBuscar && e.target !== listaSugerencias) {
            listaSugerencias.style.display = "none";
        }
    });

    // ===============================================
    // LÓGICA DE DIBUJO Y FILTROS CORREGIDA
    // ===============================================
    function dibujarPines() {
        marcadores.forEach(m => mapa.removeLayer(m));
        marcadores = [];

        // Tomar valores EXACTOS sin convertir a minúsculas todavía para evitar romper el "TODOS"
        const fTipoVal = document.getElementById('filtroTipo').value;
        const fTensionVal = document.getElementById('filtroTension').value;
        const fEstadoVal = document.getElementById('filtroEstado').value;
        const fTexto = document.getElementById('buscarMapa').value.toLowerCase().trim();

        let limites = L.latLngBounds();
        let pinesAgregados = 0;

        equiposGlobal.forEach(eq => {
            const lat = parseFloat(eq.latitud);
            const lng = parseFloat(eq.longitud);
            if (isNaN(lat) || isNaN(lng)) return;

            const tipoEq = (eq.tipo || "").toUpperCase();
            const tensionEq = (eq.nivel_tension || "").toLowerCase().trim();
            const estadoEq = (eq.estado || "").toLowerCase().trim();

            // 1. Filtrar por Texto de la barra
            if (fTexto !== "") {
                const txtPlaca = (eq.codigo || "").toLowerCase();
                const txtUbi = (eq.ubicacion || "").toLowerCase();
                const txtTipo = (eq.tipo || "").toLowerCase();
                if (!txtPlaca.includes(fTexto) && !txtUbi.includes(fTexto) && !txtTipo.includes(fTexto)) return;
            }

            // 2. Filtro Tipo
            if (fTipoVal !== "TODOS") {
                const tipoUpper = fTipoVal.toUpperCase();
                if (tipoUpper === "OCRIS" && !tipoEq.includes("OCRI")) return;
                if (tipoUpper !== "OCRIS" && !tipoEq.includes(tipoUpper)) return;
            }

            // 3. Filtro Tensión
            if (fTensionVal !== "TODOS") {
                if (!tensionEq.includes(fTensionVal.toLowerCase())) return;
            }

            // 4. Filtro Estado
            if (fEstadoVal !== "TODOS") {
                if (!estadoEq.includes(fEstadoVal.toLowerCase())) return;
            }

            // Determinar color del Pin
            let colorPin = '#16a34a'; // Verde
            if (estadoEq.includes('mantenimiento')) colorPin = '#f59e0b'; // Amarillo
            if (estadoEq.includes('fuera')) colorPin = '#dc2626'; // Rojo

            const iconoHTML = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="pin-equipo" style="background-color: ${colorPin}; width: 20px; height: 20px;"></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            const badgeTension = eq.nivel_tension ? ` [${eq.nivel_tension}]` : '';
            const linkNavegacion = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

            const contenidoPopup = `
                <div class="popup-custom">
                    <h3>${eq.codigo}</h3>
                    <p><b>Tipo:</b> ${eq.tipo}${badgeTension}</p>
                    <p><b>Ubicación:</b> ${eq.ubicacion || 'N/A'}</p>
                    <p><b>Estado:</b> ${eq.estado}</p>
                    <a href="${linkNavegacion}" target="_blank" class="btn-navegar">🗺️ Navegar hasta aquí</a>
                </div>
            `;

            const marcador = L.marker([lat, lng], { icon: iconoHTML }).bindPopup(contenidoPopup);
            marcador.addTo(mapa);
            marcadores.push(marcador);
            
            limites.extend([lat, lng]);
            pinesAgregados++;
        });

        // Zoom automático
        if (pinesAgregados > 0) {
            mapa.fitBounds(limites, { padding: [40, 40], maxZoom: 16 });
            if (pinesAgregados === 1 && fTexto !== "") {
                setTimeout(() => { marcadores[0].openPopup(); }, 300);
            }
        }
    }

    window.onload = () => {
        inicializarMapa();
        cargarEquipos();
    };
</script>
</body>
</html>
